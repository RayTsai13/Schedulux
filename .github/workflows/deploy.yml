name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/Schedulux
            git fetch origin main && git reset --hard origin/main
            export VITE_API_URL=https://schedulux.net/api
            docker compose build
            docker compose up -d
            # The instance has an 8 GB disk; drop build cache and replaced images
            docker builder prune -af > /dev/null
            docker image prune -f > /dev/null
            df -h /
            sleep 10 && docker compose logs --tail=20 backend
      - name: Health check
        run: curl --fail --retry 5 --retry-delay 10 https://schedulux.net/health
